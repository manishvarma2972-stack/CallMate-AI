services:
  - type: web
    name: callmate-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_NAME
        value: CallMate AI
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: RECEPTIONIST_OWNER_NAME
        value: Manish Varma
      - key: RECEPTIONIST_NAME
        value: CallMate
      - key: GEMINI_MODEL
        value: gemini-3.8-live
      - key: GEMINI_API_VERSION
        value: v1alpha
      - key: GEMINI_VOICE_NAME
        value: Aoede
      - key: GEMINI_TEMPERATURE
        value: "0.6"
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
