name: CI / Automated Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Pytest & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite
        env:
          SECRET_KEY: "ci-test-secret-key-for-hmac-sha256-signing"
          OWNER_API_KEY: "ci-test-owner-key"
          RECEPTIONIST_OWNER_NAME: "Manish Varma"
          GEMINI_API_KEY: "dummy-key-for-mocked-ci"
        run: |
          pytest -v --durations=10
