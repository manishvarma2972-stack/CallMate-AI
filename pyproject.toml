[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callmate-ai"
version = "0.2.0"
description = "CallMate AI - AI-powered personal voice receptionist backend foundation & Gemini Live voice engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CallMate AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "google-genai==3.3.0",
    "websockets>=13.0.0,<18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
